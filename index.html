<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Shree Hari Export – Meesho Image Studio</title>
<style>
:root{--p:#7b2ff7}
*{box-sizing:border-box;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{margin:0;background:#f5f4fa;color:#1c1c1e}
header{background:linear-gradient(135deg,#7b2ff7,#f107a3);color:#fff;padding:18px 16px}
header h1{margin:0;font-size:19px}
header p{margin:5px 0 0;font-size:13px;opacity:.92}
main{max-width:820px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 5px rgba(0,0,0,.07)}
h2{font-size:15px;margin:0 0 6px}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}
input,textarea{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;font-size:15px;background:#fff}
textarea{min-height:72px}
button{background:var(--p);color:#fff;border:0;border-radius:10px;padding:14px 18px;font-size:16px;font-weight:700;width:100%;cursor:pointer}
button.sec{background:#ece9f7;color:#4a2a8f;margin-top:10px;font-size:14px;padding:11px}
button:disabled{opacity:.55}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumbs img{width:66px;height:66px;object-fit:cover;border-radius:9px;border:1px solid #ddd}
.out{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
.item{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 5px rgba(0,0,0,.07)}
.item img{width:100%;display:block;background:#faf9ff}
.item .m{padding:9px;font-size:12px;color:#444}
.item a{display:block;text-align:center;background:#f2f0fb;color:#4a2a8f;text-decoration:none;padding:9px;font-size:13px;font-weight:700}
.st{font-size:13.5px;padding:10px 12px;border-radius:10px;background:#fff5d9;margin-top:12px;white-space:pre-wrap}
.st.err{background:#ffe3e3;color:#8a1c1c}
.st.ok{background:#e2f8e6;color:#175c26}
small.hint{color:#666;font-size:12px;display:block;margin-top:5px}
.bar{height:7px;background:#eee;border-radius:5px;overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;width:0;background:var(--p);transition:width .3s}
pre#log{background:#111;color:#8ef58e;font-size:11.5px;padding:10px;border-radius:10px;max-height:230px;overflow:auto;white-space:pre-wrap;margin-top:10px;display:none}
</style>
</head>
<body>
<header>
  <h1>🖼️ Meesho Image Studio</h1>
  <p>Shree Hari Export – photo daalo, details bharo, images ready</p>
</header>
<main>

  <div class="card">
    <h2>1️⃣ Gemini API Key (ek hi baar)</h2>
    <input id="key" type="password" placeholder="AIza... ya AQ..." />
    <small class="hint">Key sirf tumhare browser me save hoti hai. Key yahan se lo: <a href="https://aistudio.google.com/app/apikey" target="_blank">aistudio.google.com/app/apikey</a></small>
    <button class="sec" id="test">🔍 Key Test Karo (kaunse image model chalu hain)</button>
  </div>

  <div class="card">
    <h2>2️⃣ Product ki details</h2>
    <label>Product Name *</label>
    <input id="name" placeholder="e.g. Electronic Cable Organizer Pouch" />
    <label>Colours (comma se alag)</label>
    <input id="colours" placeholder="Pink, Blue, Grey, Black" />
    <label>Price (image pe dikhega)</label>
    <input id="price" placeholder="₹349 Only" />
    <label>Features / Basic details</label>
    <textarea id="features" placeholder="Double-layer storage, waterproof fabric, mesh pockets, wrist strap"></textarea>
    <label>Reference Photo * (1 se 3 photo)</label>
    <input id="file" type="file" accept="image/*" multiple />
    <div class="thumbs" id="thumbs"></div>
  </div>

  <div class="card">
    <button id="go">✨ Images Banao</button>
    <button class="sec" id="all" style="display:none">⬇️ Saari Images Download</button>
    <div class="bar"><i id="bar"></i></div>
    <div class="st" id="st" style="display:none"></div>
    <pre id="log"></pre>
  </div>

  <div class="out" id="out"></div>

</main>
<script>
var KEYS='shg_gemini_key';
function $(id){return document.getElementById(id)}
var refs=[], made=[];
$('key').value=localStorage.getItem(KEYS)||'';
$('key').addEventListener('input',function(){localStorage.setItem(KEYS,$('key').value.trim())});

function say(msg,cls){var s=$('st');s.style.display='block';s.className='st'+(cls?' '+cls:'');s.textContent=msg}
function log(msg){var l=$('log');l.style.display='block';l.textContent+=msg+'\n';l.scrollTop=l.scrollHeight}

function toB64(f){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(String(r.result).split(',')[1])};r.onerror=rej;r.readAsDataURL(f)})}

$('file').addEventListener('change',function(e){
  refs=[];$('thumbs').innerHTML='';
  var fs=Array.prototype.slice.call(e.target.files,0,3);
  Promise.all(fs.map(function(f){return toB64(f).then(function(b){
    var m=f.type||'image/jpeg';
    refs.push({mime:m,b64:b});
    var im=document.createElement('img');im.src='data:'+m+';base64,'+b;$('thumbs').appendChild(im);
  })}));
});

var MODELS=['gemini-2.5-flash-image','gemini-2.5-flash-image-preview','gemini-2.0-flash-preview-image-generation','gemini-2.5-flash-image-preview-09-2025','imagen-3.0-generate-002'];
var MODES=[null,['TEXT','IMAGE'],['IMAGE']];
var good=null;

$('test').addEventListener('click',function(){
  var key=$('key').value.trim();
  if(!key){return say('Pehle key daalo 🔑','err')}
  say('Key check kar raha hoon...');
  $('log').textContent='';
  fetch('https://generativelanguage.googleapis.com/v1beta/models?key='+encodeURIComponent(key)+'&pageSize=200')
   .then(function(r){return r.json().then(function(j){return {ok:r.ok,status:r.status,j:j}})})
   .then(function(o){
     if(!o.ok){say('❌ Key kaam nahi kar rahi. Error niche dekho.','err');log('HTTP '+o.status+'\n'+JSON.stringify(o.j,null,1));return}
     var ms=(o.j.models||[]).map(function(m){return m.name.replace('models/','')});
     var img=ms.filter(function(n){return n.indexOf('image')>-1||n.indexOf('imagen')>-1});
     say('✅ Key sahi hai. Total '+ms.length+' model mile, image wale '+img.length+'. List niche.', 'ok');
     log('IMAGE MODELS:\n'+(img.join('\n')||'(koi image model nahi — is key/account pe image generation available nahi hai)')+'\n\nALL MODELS:\n'+ms.join('\n'));
   })
   .catch(function(e){say('❌ Network/CORS error: '+e.message,'err')});
});

function variants(){
  var v=[];
  if(good){v.push(good)}
  for(var i=0;i<MODELS.length;i++){for(var j=0;j<MODES.length;j++){
    if(good&&good.m===MODELS[i]&&good.j===j)continue;
    v.push({m:MODELS[i],j:j});
  }}
  return v;
}

function genOne(prompt){
  var key=$('key').value.trim();
  var vs=variants(), i=0, lastErr='Unknown error';
  function next(){
    if(i>=vs.length)return Promise.reject(new Error(lastErr));
    var v=vs[i++];
    var parts=refs.map(function(r){return {inline_data:{mime_type:r.mime,data:r.b64}}});
    parts.push({text:prompt});
    var body={contents:[{role:'user',parts:parts}]};
    if(MODES[v.j])body.generationConfig={responseModalities:MODES[v.j]};
    return fetch('https://generativelanguage.googleapis.com/v1beta/models/'+v.m+':generateContent?key='+encodeURIComponent(key),
      {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
      .then(function(r){return r.json().then(function(j){return {ok:r.ok,status:r.status,j:j}})})
      .then(function(o){
        if(!o.ok){lastErr='HTTP '+o.status+': '+((o.j&&o.j.error&&o.j.error.message)||'?');log('❌ '+v.m+' [mode '+v.j+'] → '+lastErr);return next()}
        var c=o.j.candidates&&o.j.candidates[0];
        var ps=(c&&c.content&&c.content.parts)||[];
        var img=null,txt='';
        for(var k=0;k<ps.length;k++){var d=ps[k].inlineData||ps[k].inline_data;if(d&&d.data){img=d;break}if(ps[k].text)txt+=ps[k].text}
        if(!img){lastErr='image nahi mili. finishReason='+((c&&c.finishReason)||'?')+(txt?(' | model text: '+txt.slice(0,200)):'')+((o.j.promptFeedback)?(' | promptFeedback: '+JSON.stringify(o.j.promptFeedback)):'');log('⚠️ '+v.m+' [mode '+v.j+'] → '+lastErr);return next()}
        good=v;log('✅ '+v.m+' [mode '+v.j+'] → image mil gayi');
        return 'data:'+(img.mimeType||img.mime_type||'image/png')+';base64,'+img.data;
      })
      .catch(function(e){lastErr=e.message||String(e);log('❌ '+v.m+' → '+lastErr);return next()});
  }
  return next();
}

function buildPrompts(d){
  var base='Ultra-realistic professional e-commerce product photograph of '+d.name+'. '+(d.features?('Key details: '+d.features+'. '):'')+'Keep the exact same product design, shape, material, texture and proportions as in the reference image. Square 1:1 crop, sharp focus, high detail, no watermark, no logo, no spelling mistakes.';
  var list=[];
  list.push({id:'01_main_white',t:'Main image (white bg)',p:base+' Product centered on a pure white background with soft studio lighting and a subtle natural shadow. Entire product visible with clean margins. Marketplace catalogue style main image.'});
  list.push({id:'02_detail_open',t:'Detail / inside view',p:base+' Close-up 45-degree angle shot showing the inside, compartments, stitching and material texture in detail. Light grey seamless gradient background.'});
  list.push({id:'03_infographic',t:'Feature infographic',p:'Clean modern e-commerce infographic image for '+d.name+', white background. The product from the reference image sits in the centre, with 4 short feature callout labels connected by thin grey lines. Labels: '+(d.features||'Premium Quality, Durable Material, Lightweight, Everyday Use')+'. Minimal dark-grey sans-serif typography, small line icons, correct English spelling, square 1:1.'});
  list.push({id:'04_lifestyle',t:'Lifestyle photo',p:base+' Lifestyle shot: the product in use in a real modern Indian home or desk setting, natural daylight, product is the clear hero, softly blurred background.'});
  if(d.price)list.push({id:'05_offer',t:'Offer banner',p:'Bold, clean promotional banner image for '+d.name+'. Product from the reference image on the left on a soft gradient background. On the right, large modern typography reading exactly: "'+d.price+'", below it "Free Delivery"'+(d.colours.length>1?(', below that "'+d.colours.length+' Colours Available"'):'')+'. Bright attractive colours, no spelling mistakes, square 1:1.'});
  for(var i=0;i<d.colours.length;i++){
    var c=d.colours[i];
    list.push({id:'colour_'+(i+1)+'_'+c.toLowerCase().replace(/[^a-z0-9]+/g,'-'),t:c+' variant',p:base+' The exact same product but in '+c+' colour. Pure white background, soft studio lighting, subtle shadow, catalogue style. Only the colour changes, design stays identical.'});
  }
  return list;
}

function addItem(item,dataUrl){
  var d=document.createElement('div');d.className='item';
  var safe=(($('name').value.trim()||'product').toLowerCase().replace(/[^a-z0-9]+/g,'-'));
  d.innerHTML='<img src="'+dataUrl+'"><div class="m">'+item.t+'</div><a download="'+safe+'_'+item.id+'.png" href="'+dataUrl+'">⬇️ Download</a>';
  $('out').appendChild(d);
  made.push(d.querySelector('a'));
  $('all').style.display='block';
}

$('go').addEventListener('click',function(){
  var key=$('key').value.trim();
  var name=$('name').value.trim();
  if(!key){return say('Pehle Gemini API key daalo 🔑','err')}
  if(!name){return say('Product ka naam likho ✍️','err')}
  if(!refs.length){return say('Reference photo select karo 📷','err')}
  var d={name:name,price:$('price').value.trim(),features:$('features').value.trim(),
    colours:$('colours').value.split(',').map(function(s){return s.trim()}).filter(Boolean)};
  var list=buildPrompts(d);
  $('out').innerHTML='';made=[];$('all').style.display='none';$('log').textContent='';
  $('go').disabled=true;
  var i=0,fail=0;
  function step(){
    if(i>=list.length){
      $('go').disabled=false;$('bar').style.width='100%';
      say(fail? ('Ho gaya! '+(list.length-fail)+'/'+list.length+' images bani, '+fail+' fail. Niche kaali box me error dekho aur mujhe screenshot bhejo.') : ('✅ Ho gaya! Saari '+list.length+' images ready hain. Niche se download karo.'),fail?'err':'ok');
      return;
    }
    var it=list[i];
    say('Ban rahi hai... '+(i+1)+'/'+list.length+'  ('+it.t+')\n10-20 second per image lagta hai.');
    $('bar').style.width=Math.round(i/list.length*100)+'%';
    genOne(it.p).then(function(url){addItem(it,url)})
      .catch(function(e){fail++;log('>>> FAIL: '+it.t+' — '+e.message)})
      .then(function(){i++;setTimeout(step,600)});
  }
  step();
});

$('all').addEventListener('click',function(){
  made.forEach(function(a,k){setTimeout(function(){a.click()},k*700)});
});
</script>
</body>
</html>
